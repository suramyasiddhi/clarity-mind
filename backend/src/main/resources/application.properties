# Server configuration
server.port=8080

# SQLite Persistent Local File Datasource configuration
spring.datasource.url=jdbc:sqlite:./data/clarity-minds.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Connection pool settings for local SQLite file
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Secret Configuration (256-bit key for HMAC-SHA256)
app.jwt.secret=9a3b6c8d1e4f7a2b5c8d1e4f7a2b5c8d1e4f7a2b5c8d1e4f7a2b5c8d1e4f7a2b
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.clarityminds=INFO
logging.level.org.springframework.security=WARN
